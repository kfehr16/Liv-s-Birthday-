<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>For Liv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app" class="is-loading">

    <!-- Welcome / Landing -->
    <section id="welcome" class="section section--welcome">
      <div class="welcome__content">
        <h1 id="site-title" class="handwritten welcome__title">For Liv</h1>
        <p id="welcome-message" class="welcome__message"></p>
        <button id="come-in-btn" class="btn btn--primary come-in-btn" type="button">
          come in <span aria-hidden="true">&darr;</span>
        </button>
      </div>
    </section>

    <!-- Open When Cards -->
    <section id="open-when" class="section">
      <h2 class="handwritten section__title">open when&hellip;</h2>
      <p class="section__subtitle">a little something for whatever mood finds you</p>
      <div id="open-when-grid" class="open-when-grid" aria-live="polite"></div>
    </section>

    <!-- Memory Lane -->
    <section id="memory-lane" class="section">
      <h2 class="handwritten section__title">memory lane</h2>
      <p class="section__subtitle">a few of my favorites so far</p>
      <div id="memory-grid" class="memory-grid"></div>
    </section>

    <!-- Notes / Letters -->
    <section id="letters" class="section">
      <h2 class="handwritten section__title">letters</h2>
      <p class="section__subtitle">a few things I wanted to write down</p>
      <div id="letters-list" class="letters-list"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer__line handwritten">&hellip;and more to come</p>
      <p id="footer-updated" class="footer__updated"></p>
    </footer>

  </main>

  <!-- Open-when note overlay -->
  <div id="note-overlay" class="overlay" hidden>
    <div class="overlay__backdrop" data-close-overlay></div>
    <div class="note-card" role="dialog" aria-modal="true" aria-labelledby="note-card-title">
      <button class="overlay__close" type="button" data-close-overlay aria-label="Close">&times;</button>
      <h3 id="note-card-title" class="handwritten note-card__title"></h3>
      <p id="note-card-message" class="note-card__message"></p>
      <img id="note-card-image" class="note-card__image" alt="" hidden>
      <a id="note-card-link" class="note-card__link" href="#" target="_blank" rel="noopener" hidden>open link</a>
    </div>
  </div>

  <!-- Lightbox overlay -->
  <div id="lightbox-overlay" class="overlay" hidden>
    <div class="overlay__backdrop" data-close-lightbox></div>
    <div class="lightbox">
      <button class="overlay__close" type="button" data-close-lightbox aria-label="Close">&times;</button>
      <img id="lightbox-image" class="lightbox__image" alt="">
      <p id="lightbox-caption" class="lightbox__caption"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
